<!DOCTYPE html>
<html>
<head>
  <title>AI Multi Demo</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00f7ff;
    }

    select, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #111;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #00f7ff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .output {
      margin-top: 20px;
      background: #111;
      padding: 15px;
      border-radius: 5px;
      min-height: 80px;
    }

    .loading {
      color: #00f7ff;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>AI Multi-Project Demo 🚀</h1>

<label>Select AI Task:</label>
<select id="task">
  <option value="support">Customer Support</option>
  <option value="extract">Data Extraction</option>
  <option value="summary">Summarization</option>
</select>

<textarea id="input" placeholder="Enter your input..."></textarea>

<button onclick="runAI()">Generate</button>

<div class="loading" id="loading"></div>
<div class="output" id="output"></div>

<script>
function runAI() {
  const input = document.getElementById("input").value;
  const task = document.getElementById("task").value;
  const outputBox = document.getElementById("output");
  const loading = document.getElementById("loading");

  if (!input) {
    outputBox.innerText = "Please enter some input.";
    return;
  }

  loading.innerText = "Generating response...";
  outputBox.innerText = "";

  setTimeout(() => {
    let output = "";

    if (task === "support") {
      output = `I understand your concern: "${input}". 
I sincerely apologize for the inconvenience. 
Let me assist you and resolve this issue as quickly as possible.`;
    }

    else if (task === "extract") {
      output = `{
"name": "Rahul",
"product": "laptop",
"price": "55000 INR",
"date": "March 2, 2025"
}`;
    }

    else if (task === "summary") {
      output = `• Key idea from input  
• Important detail extracted  
• Final concise summary`;
    }

    loading.innerText = "";
    outputBox.innerText = output;

  }, 1000); // simulates AI delay
}
</script>

</body>
</html>
